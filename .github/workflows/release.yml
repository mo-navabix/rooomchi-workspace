name: Build Enterprise Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get release version
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build Enterprise Package
  env:
    ROOOMCHI_RELEASE_VERSION: ${{ env.VERSION }}
  run: |
    chmod +x scripts/build-enterprise-release.sh
    ./scripts/build-enterprise-release.sh

      - name: Verify package
        run: |
          test -f "dist-enterprise/rooomchi-enterprise-v${VERSION}.tar.gz"
          tar -tzf "dist-enterprise/rooomchi-enterprise-v${VERSION}.tar.gz" > /dev/null

      - name: Generate SHA256
        run: |
          cd dist-enterprise
          sha256sum "rooomchi-enterprise-v${VERSION}.tar.gz" > SHA256SUMS.txt

      - name: Upload package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist-enterprise/rooomchi-enterprise-v${VERSION}.tar.gz" \
            "dist-enterprise/SHA256SUMS.txt" \
            --clobber
