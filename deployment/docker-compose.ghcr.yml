# Rooomchi production stack using pre-built images from GHCR (no local build).
#
#   docker login ghcr.io -u YOUR_GITHUB_USERNAME -p YOUR_TOKEN
#   docker compose -f deployment/docker-compose.ghcr.yml --env-file .env pull
#   docker compose -f deployment/docker-compose.ghcr.yml --env-file .env up -d
#
# Set ROOOMCHI_BACKEND_IMAGE and ROOOMCHI_FRONTEND_IMAGE in .env (see docs/GHCR.md).

name: rooomchi

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rooomchi_db}
    volumes:
      - rooomchi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-rooomchi_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rooomchi

  backend:
    image: ${ROOOMCHI_BACKEND_IMAGE:?Set ROOOMCHI_BACKEND_IMAGE in .env — see docs/GHCR.md}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_ONLY: "true"
      SERVE_STATIC: "false"
      SKIP_SCHEMA_ENSURE: "true"
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rooomchi_db}
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: ${APP_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health | grep -q healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - rooomchi

  frontend:
    image: ${ROOOMCHI_FRONTEND_IMAGE:?Set ROOOMCHI_FRONTEND_IMAGE in .env — see docs/GHCR.md}
    pull_policy: always
    restart: unless-stopped
    networks:
      - rooomchi

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${ROOOMCHI_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - rooomchi

volumes:
  rooomchi_pg_data:

networks:
  rooomchi:
    driver: bridge
