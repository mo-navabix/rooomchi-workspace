# Rooomchi GHCR stack with an **external** PostgreSQL (managed DB / org server).
# No `postgres` container — set DATABASE_URL (and DATABASE_SSL=true if required).
#
#   cp .env.example .env
#   # DATABASE_URL=postgresql://user:pass@db.example.com:5432/rooomchi_db
#   # DATABASE_SSL=true
#   docker compose -f deployment/docker-compose.prod.ghcr.external-db.yml --env-file .env --profile watchtower up -d

name: rooomchi

x-watchtower-labels: &watchtower_app_labels
  com.centurylinklabs.watchtower.enable: "true"

x-watchtower-skip: &watchtower_skip_labels
  com.centurylinklabs.watchtower.enable: "false"

services:
  backend:
    image: ${IMAGE_GHCR_BACKEND:-${ROOOMCHI_BACKEND_IMAGE:?Set IMAGE_GHCR_BACKEND in .env}}
    pull_policy: always
    restart: unless-stopped
    labels:
      <<: *watchtower_app_labels
    environment:
      NODE_ENV: production
      PORT: 3000
      API_ONLY: "true"
      SERVE_STATIC: "false"
      SKIP_SCHEMA_ENSURE: "true"
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your external PostgreSQL URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SETUP_ENCRYPTION_KEY: ${SETUP_ENCRYPTION_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health | grep -q healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - rooomchi

  frontend:
    image: ${IMAGE_GHCR_FRONTEND:-${ROOOMCHI_FRONTEND_IMAGE:?Set IMAGE_GHCR_FRONTEND in .env}}
    pull_policy: always
    restart: unless-stopped
    labels:
      <<: *watchtower_app_labels
    networks:
      - rooomchi

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    labels:
      <<: *watchtower_skip_labels
    ports:
      - "${ROOOMCHI_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - rooomchi

  watchtower:
    image: containrrr/watchtower:1.7.1
    profiles:
      - watchtower
    restart: unless-stopped
    labels:
      <<: *watchtower_skip_labels
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-86400}
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      REPO_USER: ${GHCR_USERNAME:-}
      REPO_PASS: ${GHCR_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rooomchi

networks:
  rooomchi:
    driver: bridge
