# Local PostgreSQL only — credentials are fixed here so cloud DB vars in `.env` do not affect Docker.
# App should use: DB_HOST=localhost DB_USERNAME=postgres DB_PASSWORD=postgres DB_DATABASE=rooomchi_db

services:
  postgres:
    image: postgres:16-alpine
    container_name: rooomchi-postgres
    restart: unless-stopped
    ports:
      - "${ROOOMCHI_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rooomchi_db
    volumes:
      - rooomchi_pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./schema/02-server-extensions.sql:/docker-entrypoint-initdb.d/02-server-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rooomchi_db"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  rooomchi_pg_data:
