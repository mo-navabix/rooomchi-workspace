# Local PostgreSQL only — credentials are fixed here so cloud DB vars in `.env` do not affect Docker.
# App should use: DB_HOST=localhost DB_USERNAME=postgres DB_PASSWORD=postgres DB_DATABASE=rooomchi_db

services:
  postgres:
    image: postgres:16-alpine
    container_name: rooomchi-postgres
    restart: unless-stopped
    ports:
      - "${ROOOMCHI_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rooomchi_db
    volumes:
      - rooomchi_pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./schema/02-server-extensions.sql:/docker-entrypoint-initdb.d/02-server-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rooomchi_db"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Web UI for SQL — npm run db:admin → http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: rooomchi-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ROOOMCHI_PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@rooomchi.ir}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # No extra "master password" popup on first open (dev only)
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - rooomchi_pgadmin_data:/var/lib/pgadmin
      # Loaded once when pgadmin volume is empty — run: npm run db:admin:reset
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  rooomchi_pg_data:
  rooomchi_pgadmin_data:
