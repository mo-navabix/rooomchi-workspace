apiVersion: apps/v1
kind: Deployment
metadata:
  name: rooomchi-backend
  namespace: rooomchi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rooomchi-backend
  template:
    metadata:
      labels:
        app: rooomchi-backend
    spec:
      containers:
        - name: backend
          image: rooomchi-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: rooomchi-app
            - configMapRef:
                name: rooomchi-config
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
