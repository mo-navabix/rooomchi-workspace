apiVersion: apps/v1
kind: Deployment
metadata:
  name: rooomchi-frontend
  namespace: rooomchi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rooomchi-frontend
  template:
    metadata:
      labels:
        app: rooomchi-frontend
    spec:
      containers:
        - name: frontend
          image: rooomchi-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
