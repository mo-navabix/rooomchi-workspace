apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rooomchi
  namespace: rooomchi
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: meetings.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rooomchi-backend
                port:
                  number: 3000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: rooomchi-backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rooomchi-frontend
                port:
                  number: 80
