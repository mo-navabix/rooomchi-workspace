apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rooomchi
spec:
  ports:
    - port: 5432
  selector:
    app: rooomchi-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rooomchi-postgres
  namespace: rooomchi
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: rooomchi-postgres
  template:
    metadata:
      labels:
        app: rooomchi-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: rooomchi-postgres
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
