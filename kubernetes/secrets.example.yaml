# Copy to secrets.yaml, fill values, apply with kubectl — do not commit secrets.
apiVersion: v1
kind: Secret
metadata:
  name: rooomchi-postgres
  namespace: rooomchi
type: Opaque
stringData:
  POSTGRES_USER: rooomchi
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: rooomchi_db
---
apiVersion: v1
kind: Secret
metadata:
  name: rooomchi-app
  namespace: rooomchi
type: Opaque
stringData:
  JWT_SECRET: CHANGE_ME_LONG_RANDOM
  DATABASE_URL: postgresql://rooomchi:CHANGE_ME@postgres:5432/rooomchi_db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rooomchi-config
  namespace: rooomchi
data:
  APP_URL: https://meetings.example.com
  NODE_ENV: production
  API_ONLY: "true"
  LOG_LEVEL: info
