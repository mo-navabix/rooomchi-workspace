apiVersion: v1
kind: Service
metadata:
  name: rooomchi-backend
  namespace: rooomchi
spec:
  selector:
    app: rooomchi-backend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: rooomchi-frontend
  namespace: rooomchi
spec:
  selector:
    app: rooomchi-frontend
  ports:
    - port: 80
      targetPort: 80
