# Rooomchi Enterprise — self-hosted stack (GHCR images, no source on server)
# Usage: ./install.sh   or   docker compose --env-file config/.env pull && up -d
#
# Watchtower (server-wide or --profile watchtower): only containers labeled
# com.centurylinklabs.watchtower.enable=true are auto-updated (backend + frontend).

name: rooomchi-enterprise

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    env_file:
      - ./config/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rooomchi_db}
    volumes:
      - rooomchi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-rooomchi_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rooomchi

  backend:
    image: ${IMAGE_GHCR_BACKEND:?IMAGE_GHCR_BACKEND is required — set in config/.env}
    pull_policy: always
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      NODE_ENV: production
      PORT: 3000
      API_ONLY: "true"
      SERVE_STATIC: "false"
      SKIP_SCHEMA_ENSURE: "true"
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rooomchi_db}}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-${APP_URL}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SETUP_ENCRYPTION_KEY: ${SETUP_ENCRYPTION_KEY:-}
      UPLOAD_PATH: /data/uploads
      LICENSE_PATH: /app/config/license.json
    volumes:
      - ./storage/uploads:/data/uploads
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health | grep -q healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - rooomchi

  frontend:
    image: ${IMAGE_GHCR_FRONTEND:?IMAGE_GHCR_FRONTEND is required — set in config/.env}
    pull_policy: always
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - rooomchi

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    ports:
      - "127.0.0.1:${ROOOMCHI_HTTP_PORT:-10808}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - rooomchi

  watchtower:
    image: containrrr/watchtower:1.7.1
    profiles:
      - watchtower
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-86400}
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      REPO_USER: ${GHCR_USERNAME:-}
      REPO_PASS: ${GHCR_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  rooomchi_pg_data:

networks:
  rooomchi:
    driver: bridge
