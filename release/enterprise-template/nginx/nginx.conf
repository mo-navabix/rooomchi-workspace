worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # When TLS terminates on the host nginx, preserve the client scheme for the API.
    map $http_x_forwarded_proto $rooomchi_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream rooomchi_frontend {
        server frontend:80;
    }

    upstream rooomchi_backend {
        server backend:3000;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://rooomchi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $rooomchi_forwarded_proto;
        }

        location /health {
            proxy_pass http://rooomchi_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://rooomchi_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $rooomchi_forwarded_proto;
        }
    }
}
