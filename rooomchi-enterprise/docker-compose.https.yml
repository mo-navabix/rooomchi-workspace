# Optional: TLS inside Docker nginx (mount certs under nginx/ssl/)
#
#   mkdir -p nginx/ssl
#   # fullchain.pem + privkey.pem
#   docker compose --env-file ./config/.env -f docker-compose.yml -f docker-compose.https.yml up -d

services:
  nginx:
    ports:
      - "${ROOOMCHI_HTTP_PORT:-80}:80"
      - "${ROOOMCHI_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.https.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
