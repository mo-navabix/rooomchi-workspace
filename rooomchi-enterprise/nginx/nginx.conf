# Copy of deployment/nginx/nginx.conf — customize server_name and SSL here
include /etc/nginx/mime.types;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    client_max_body_size 20m;

    upstream rooomchi_frontend {
        server frontend:80;
    }

    upstream rooomchi_backend {
        server backend:3000;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://rooomchi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://rooomchi_backend/health;
        }

        location / {
            proxy_pass http://rooomchi_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
